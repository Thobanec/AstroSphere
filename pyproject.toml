[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "astrosphere"
version = "0.1.0"
description = "Solar System Analysis Platform"
requires-python = ">=3.11"

dependencies = [
    "Flask>=3.1,<4",
    "matplotlib>=3.11,<4",
    "numpy>=2.0,<3",
    "skyfield>=1.55,<2",
]


[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]