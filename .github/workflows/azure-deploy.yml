name: Deploy AstroSphere to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: AstroSphere-Azure
  AZURE_RESOURCE_GROUP: AstroSphere-RG
  ACR_NAME: astrosphereacr
  IMAGE_NAME: astrosphere
  CONTAINER_NAME: main
  TARGET_PORT: 5000
  STARTUP_COMMAND: gunicorn --bind 0.0.0.0:5000 web.app:app
  HEALTH_PATH: /api/v1/planets

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests before deployment
        run: |
          python -m pytest tests -v

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Web App exists
        run: |
          echo "Checking Azure Web App..."

          az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name,state:state,defaultHostName:defaultHostName,linuxFxVersion:siteConfig.linuxFxVersion,appCommandLine:siteConfig.appCommandLine,healthCheckPath:siteConfig.healthCheckPath}" \
            -o json

      - name: Get production hostname
        shell: bash
        run: |
          HOSTNAME=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "defaultHostName" \
            -o tsv)

          if [ -z "$HOSTNAME" ]; then
            echo "ERROR: Azure Web App hostname could not be determined."
            exit 1
          fi

          echo "Production hostname: $HOSTNAME"
          echo "APP_HOSTNAME=$HOSTNAME" >> "$GITHUB_ENV"

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name "${{ env.ACR_NAME }}"

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "Building image:"
          echo "$IMAGE"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Configure Azure Site Container
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          echo "=============================================="
          echo "Configuring Azure Site Container"
          echo "=============================================="
          echo "Image: $IMAGE"
          echo "Startup: ${{ env.STARTUP_COMMAND }}"
          echo "Port: ${{ env.TARGET_PORT }}"

          az webapp config set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --linux-fx-version "sitecontainers" \
            --startup-file "${{ env.STARTUP_COMMAND }}"

          az webapp sitecontainers update \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-name "${{ env.CONTAINER_NAME }}" \
            --image "$IMAGE" \
            --target-port "${{ env.TARGET_PORT }}" \
            --is-main true \
            --startup-cmd "${{ env.STARTUP_COMMAND }}"

      - name: Configure health check
        run: |
          az webapp config set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --generic-configurations '{"healthCheckPath":"/api/v1/planets"}'

      - name: Configure AstroSphere monitoring
        run: |
          echo "=============================================="
          echo "Configuring AstroSphere monitoring"
          echo "=============================================="

          az webapp config appsettings set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --settings \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              WEBSITE_SKIP_RUNNING_KUDUAGENT=false \
              ASTROSPHERE_MONITORING_INTERVAL_SECONDS=900 \
              ASTROSPHERE_MONITORING_DATABASE=/home/data/monitoring.db

          az webapp config set \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --generic-configurations '{"alwaysOn":true,"healthCheckPath":"/api/v1/planets"}'

          echo "AstroSphere monitoring configuration applied."

      - name: Verify deployment configuration
        shell: bash
        run: |
          echo "=============================================="
          echo "Verifying Azure configuration"
          echo "=============================================="

          WEBAPP_CONFIG=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{state:state,linuxFxVersion:siteConfig.linuxFxVersion,appCommandLine:siteConfig.appCommandLine,healthCheckPath:siteConfig.healthCheckPath}" \
            -o json)

          echo "$WEBAPP_CONFIG"

          LINUX_FX=$(echo "$WEBAPP_CONFIG" | jq -r '.linuxFxVersion')
          STARTUP=$(echo "$WEBAPP_CONFIG" | jq -r '.appCommandLine')
          HEALTH=$(echo "$WEBAPP_CONFIG" | jq -r '.healthCheckPath')

          if [ "$LINUX_FX" != "sitecontainers" ]; then
            echo "ERROR: Azure Web App is not using Site Containers."
            exit 1
          fi

          if [ "$STARTUP" != "${{ env.STARTUP_COMMAND }}" ]; then
            echo "ERROR: App Service startup command is incorrect."
            echo "Expected: ${{ env.STARTUP_COMMAND }}"
            echo "Actual:   $STARTUP"
            exit 1
          fi

          if [ "$HEALTH" != "${{ env.HEALTH_PATH }}" ]; then
            echo "ERROR: Health check path is incorrect."
            echo "Expected: ${{ env.HEALTH_PATH }}"
            echo "Actual:   $HEALTH"
            exit 1
          fi

          echo ""
          echo "Verifying AstroSphere monitoring configuration:"

          MONITORING_CONFIG=$(az webapp config appsettings list \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[?name=='WEBSITES_ENABLE_APP_SERVICE_STORAGE' || name=='WEBSITE_SKIP_RUNNING_KUDUAGENT' || name=='ASTROSPHERE_MONITORING_INTERVAL_SECONDS' || name=='ASTROSPHERE_MONITORING_DATABASE'] | {storage: [?name=='WEBSITES_ENABLE_APP_SERVICE_STORAGE'].value | [0], kudu: [?name=='WEBSITE_SKIP_RUNNING_KUDUAGENT'].value | [0], interval: [?name=='ASTROSPHERE_MONITORING_INTERVAL_SECONDS'].value | [0], database: [?name=='ASTROSPHERE_MONITORING_DATABASE'].value | [0]}" \
            -o json)

          echo "$MONITORING_CONFIG"

          STORAGE_ENABLED=$(echo "$MONITORING_CONFIG" | jq -r '.storage')
          KUDUAGENT_ENABLED=$(echo "$MONITORING_CONFIG" | jq -r '.kudu')
          MONITORING_INTERVAL=$(echo "$MONITORING_CONFIG" | jq -r '.interval')
          MONITORING_DATABASE=$(echo "$MONITORING_CONFIG" | jq -r '.database')

          if [ "$STORAGE_ENABLED" != "true" ]; then
            echo "ERROR: App Service persistent storage is not enabled."
            exit 1
          fi

          if [ "$KUDUAGENT_ENABLED" != "false" ]; then
            echo "ERROR: WEBSITE_SKIP_RUNNING_KUDUAGENT must be false."
            echo "Actual:   $KUDUAGENT_ENABLED"
            exit 1
          fi

          if [ "$MONITORING_INTERVAL" != "900" ]; then
            echo "ERROR: Monitoring interval is incorrect."
            echo "Expected: 900"
            echo "Actual:   $MONITORING_INTERVAL"
            exit 1
          fi

          if [ "$MONITORING_DATABASE" != "/home/data/monitoring.db" ]; then
            echo "ERROR: Monitoring database path is incorrect."
            echo "Expected: /home/data/monitoring.db"
            echo "Actual:   $MONITORING_DATABASE"
            exit 1
          fi

          ALWAYS_ON=$(az webapp show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "siteConfig.alwaysOn" \
            -o tsv)

          if [ "$ALWAYS_ON" != "true" ]; then
            echo "ERROR: Always On is not enabled."
            exit 1
          fi

          echo "AstroSphere monitoring configuration verified successfully."

          echo ""
          echo "Site Container configuration:"

          az webapp sitecontainers show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-name "${{ env.CONTAINER_NAME }}" \
            --query "{image:image,isMain:isMain,startUpCommand:startUpCommand,targetPort:targetPort}" \
            -o json

          CONTAINER_CONFIG=$(az webapp sitecontainers show \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --container-name "${{ env.CONTAINER_NAME }}" \
            -o json)

          CONTAINER_IMAGE=$(echo "$CONTAINER_CONFIG" | jq -r '.image')
          CONTAINER_MAIN=$(echo "$CONTAINER_CONFIG" | jq -r '.isMain')
          CONTAINER_STARTUP=$(echo "$CONTAINER_CONFIG" | jq -r '.startUpCommand')
          CONTAINER_PORT=$(echo "$CONTAINER_CONFIG" | jq -r '.targetPort')

          EXPECTED_IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

          if [ "$CONTAINER_IMAGE" != "$EXPECTED_IMAGE" ]; then
            echo "ERROR: Site Container image is incorrect."
            echo "Expected: $EXPECTED_IMAGE"
            echo "Actual:   $CONTAINER_IMAGE"
            exit 1
          fi

          if [ "$CONTAINER_MAIN" != "true" ]; then
            echo "ERROR: Site Container is not configured as the main container."
            exit 1
          fi

          if [ "$CONTAINER_STARTUP" != "${{ env.STARTUP_COMMAND }}" ]; then
            echo "ERROR: Site Container startup command is incorrect."
            exit 1
          fi

          if [ "$CONTAINER_PORT" != "${{ env.TARGET_PORT }}" ]; then
            echo "ERROR: Site Container target port is incorrect."
            exit 1
          fi

          echo ""
          echo "Azure deployment configuration verified successfully."

      - name: Restart application
        run: |
          echo "Restarting AstroSphere..."

          az webapp restart \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}"

      - name: Wait for application startup
        shell: bash
        run: |
          echo "=============================================="
          echo "Waiting for Azure application startup"
          echo "=============================================="

          RUNNING=false

          for i in {1..30}; do
            STATE=$(az webapp show \
              --name "${{ env.AZURE_WEBAPP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query "state" \
              -o tsv)

            echo "Attempt $i/30 - Azure state: $STATE"

            if [ "$STATE" = "Running" ]; then
              RUNNING=true
              break
            fi

            sleep 10
          done

          if [ "$RUNNING" != "true" ]; then
            echo ""
            echo "ERROR: Azure application did not reach Running state within 5 minutes."
            exit 1
          fi

          echo ""
          echo "Azure application is Running."

      - name: Deploy AstroSphere monitoring WebJob
        shell: bash
        run: |
          set -euo pipefail

          WEBJOB_DIR="App_Data/jobs/continuous/astrosphere-monitoring"
          WEBJOB_ZIP="${RUNNER_TEMP}/astrosphere-monitoring.zip"

          echo "=============================================="
          echo "Preparing AstroSphere monitoring WebJob"
          echo "=============================================="

          if [ ! -f "${WEBJOB_DIR}/run.py" ]; then
            echo "ERROR: ${WEBJOB_DIR}/run.py not found."
            exit 1
          fi

          if [ ! -f "${WEBJOB_DIR}/settings.job" ]; then
            echo "ERROR: ${WEBJOB_DIR}/settings.job not found."
            exit 1
          fi

          cd "${WEBJOB_DIR}"

          zip -j "${WEBJOB_ZIP}" run.py settings.job

          echo "WebJob package:"
          unzip -l "${WEBJOB_ZIP}"

          echo "Obtaining Azure access token..."

          TOKEN=$(az account get-access-token \
            --resource https://management.azure.com/ \
            --query accessToken \
            -o tsv)

          echo "Resolving Kudu SCM hostname..."

          SCM_HOST=$(az webapp deployment list-publishing-profiles \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[?publishMethod=='ZipDeploy'].publishUrl | [0]" \
            -o tsv \
            | cut -d: -f1)

          if [ -z "${SCM_HOST}" ]; then
            echo "ERROR: Unable to resolve ZipDeploy SCM hostname."
            exit 1
          fi

          echo "SCM host: ${SCM_HOST}"

          echo "Deploying Continuous WebJob..."

          curl --fail-with-body \
            --silent \
            --show-error \
            -X PUT \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/zip" \
            --data-binary "@${WEBJOB_ZIP}" \
            "https://${SCM_HOST}/api/zip/site/wwwroot/App_Data/jobs/continuous/astrosphere-monitoring/"

          echo "AstroSphere monitoring WebJob package deployed."

      - name: Verify AstroSphere monitoring WebJob
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Verifying AstroSphere monitoring WebJob"
          echo "=============================================="

          WEBJOBS=$(az webapp webjob continuous list \
            --name "${{ env.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            -o json)

          echo "$WEBJOBS"

          STATUS=$(echo "$WEBJOBS" | python -c "import json,sys; jobs=json.load(sys.stdin); print(next((j.get('status','') for j in jobs if j.get('name','').endswith('/astrosphere-monitoring')), ''))")

          if [ "$STATUS" != "Running" ]; then
            echo ""
            echo "ERROR: astrosphere-monitoring WebJob is not Running."
            echo "Actual status: ${STATUS:-NOT_FOUND}"
            exit 1
          fi

          echo ""
          echo "AstroSphere monitoring WebJob is Running."

      - name: Verify AstroSphere monitoring worker
        shell: bash
        run: |
          set -euo pipefail

          WORKER_URL="https://${APP_HOSTNAME}/api/v1/monitoring/worker"

          echo "=============================================="
          echo "Verifying AstroSphere monitoring worker"
          echo "=============================================="
          echo "Testing: $WORKER_URL"

          SUCCESS=false

          for attempt in {1..18}; do
            echo "Worker health attempt $attempt/18..."

            RESPONSE=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 20 \
              "$WORKER_URL")

            echo "$RESPONSE" | python -m json.tool

            HEALTH=$(echo "$RESPONSE" | python -c "import json,sys; payload=json.load(sys.stdin); worker=payload.get('data'); print('healthy' if worker and worker.get('status') == 'running' else 'not-ready')")

            if [ "$HEALTH" = "healthy" ]; then
              echo ""
              echo "AstroSphere monitoring worker is healthy."
              SUCCESS=true
              break
            fi

            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "ERROR: AstroSphere monitoring worker did not become healthy."
            exit 1
          fi
      - name: Smoke test production API
        shell: bash
        run: |
          URL="https://${APP_HOSTNAME}${{ env.HEALTH_PATH }}"

          echo "=============================================="
          echo "Production API smoke test"
          echo "=============================================="
          echo "Testing: $URL"

          SUCCESS=false

          for i in {1..18}; do
            echo "Smoke test attempt $i/18..."

            if curl --fail --silent --show-error \
              --max-time 20 \
              "$URL" \
              -o /tmp/planets.json; then

              if [ ! -s /tmp/planets.json ]; then
                echo "API response was empty."
                exit 1
              fi

              echo "Production API responded successfully."
              echo "API response received:"
              head -c 500 /tmp/planets.json
              echo ""

              SUCCESS=true
              break
            fi

            sleep 10
          done

          if [ "$SUCCESS" != "true" ]; then
            echo ""
            echo "ERROR: Production API smoke test failed."
            exit 1
          fi

      - name: Verify production landing page
        shell: bash
        run: |
          URL="https://${APP_HOSTNAME}/"

          echo "=============================================="
          echo "Production landing page smoke test"
          echo "=============================================="
          echo "Testing: $URL"

          curl --fail --silent --show-error \
            --max-time 20 \
            "$URL" \
            -o /tmp/landing.html

          if [ ! -s /tmp/landing.html ]; then
            echo "ERROR: Landing page response was empty."
            exit 1
          fi

          if grep -q "AstroSphere" /tmp/landing.html; then
            echo "Production landing page verified successfully."
          else
            echo "ERROR: AstroSphere landing page content was not detected."
            exit 1
          fi

      - name: Deployment completed
        run: |
          echo "=============================================="
          echo "AstroSphere deployment completed successfully"
          echo "=============================================="
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Hostname: https://${APP_HOSTNAME}"
          echo "Startup: ${{ env.STARTUP_COMMAND }}"
          echo "Port: ${{ env.TARGET_PORT }}"
          echo "Health: ${{ env.HEALTH_PATH }}"
          echo "=============================================="