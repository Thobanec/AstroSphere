<!DOCTYPE html>

<html lang="en">

<head>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AstroSphere | Milky Way Explorer
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    {% include "_ai_floating_button.html" %}
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/astrosphere-ai.css') }}"
    >

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% 30%,
                    #111936 0%,
                    #060918 42%,
                    #02030b 100%
                );
            color: #ffffff;
            overflow-x: hidden;
        }

        .galaxy-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .galaxy-header {
            position: relative;
            z-index: 30;
            padding: 16px 30px;
            background:
                rgba(2, 4, 15, 0.88);
            border-bottom:
                1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(14px);
        }

        .galaxy-brand {
            max-width: 1450px;
            margin: 0 auto;

            display: flex;
            align-items: center;
            gap: 14px;
        }

        .galaxy-logo {
            font-size: 2rem;
        }

        .galaxy-brand h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        .galaxy-brand p {
            margin: 3px 0 0;
            font-size: 0.75rem;
            opacity: 0.65;
        }


        /* =====================================================
           HERO
           ===================================================== */

        .galaxy-hero {
            text-align: center;
            padding:
                32px 20px
                18px;
        }

        .galaxy-hero h2 {
            margin: 0 0 8px;

            font-size:
                clamp(
                    2rem,
                    4vw,
                    3.2rem
                );
        }

        .galaxy-hero p {
            max-width: 850px;
            margin: 0 auto;

            line-height: 1.6;
            opacity: 0.72;
        }


        /* =====================================================
           GALAXY VIEWER
           ===================================================== */

        .galaxy-wrapper {
            width:
                min(
                    1500px,
                    96%
                );

            margin:
                0 auto;

            position: relative;
        }

        .galaxy-container {
            position: relative;

            width: 100%;

            height:
                min(
                    76vh,
                    820px
                );

            min-height: 570px;

            overflow: hidden;

            border-radius: 22px;

            background:
                radial-gradient(
                    ellipse at center,
                    #03050d 0%,
                    #010208 72%,
                    #000105 100%
                );

            border:
                1px solid
                rgba(255,255,255,0.13);

            box-shadow:
                0 30px 100px
                rgba(0,0,0,0.65),

                inset 0 0 100px
                rgba(70,90,180,0.05);

            cursor: grab;
        }

        .galaxy-container.dragging {
            cursor: grabbing;
        }

        #galaxyCanvas {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;
        }


        /* =====================================================
           VIEWER HEADER
           ===================================================== */

        .viewer-top {
            position: absolute;

            top: 18px;
            left: 18px;
            right: 18px;

            display: flex;
            justify-content:
                space-between;

            align-items: center;

            gap: 10px;

            z-index: 10;

            pointer-events: none;
        }

        .viewer-chip {
            padding:
                9px 13px;

            border-radius: 9px;

            background:
                rgba(0,0,0,0.58);

            border:
                1px solid
                rgba(255,255,255,0.12);

            backdrop-filter:
                blur(12px);

            font-size: 0.75rem;

            letter-spacing:
                0.03em;
        }


        /* =====================================================
           INFORMATION PANEL
           ===================================================== */

        .galaxy-info {
            position: absolute;

            left: 22px;
            bottom: 22px;

            width:
                min(
                    390px,
                    calc(100% - 44px)
                );

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(3,6,18,0.84);

            border:
                1px solid
                rgba(255,255,255,0.14);

            backdrop-filter:
                blur(16px);

            box-shadow:
                0 18px 50px
                rgba(0,0,0,0.45);

            z-index: 15;
        }

        .galaxy-info h3 {
            margin:
                0 0 10px;

            font-size: 1.05rem;
        }

        .galaxy-info p {
            margin: 0;

            font-size: 0.85rem;

            line-height: 1.65;

            opacity: 0.82;
        }

        .galaxy-info .info-distance {
            margin-top: 13px;

            padding-top: 11px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 0.75rem;

            line-height: 1.5;

            opacity: 0.58;
        }


        /* =====================================================
           LEGEND
           ===================================================== */

        .galaxy-legend {
            position: absolute;

            right: 22px;
            bottom: 22px;

            width: 235px;

            padding: 17px;

            border-radius: 14px;

            background:
                rgba(3,6,18,0.78);

            border:
                1px solid
                rgba(255,255,255,0.12);

            backdrop-filter:
                blur(14px);

            z-index: 15;
        }

        .galaxy-legend h4 {
            margin:
                0 0 12px;

            font-size: 0.88rem;
        }

        .legend-item {
            display: flex;

            align-items: center;

            gap: 9px;

            margin:
                8px 0;

            font-size: 0.75rem;

            opacity: 0.78;
        }

        .legend-symbol {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            flex-shrink: 0;
        }

        .legend-center {
            background: #ffd48a;

            box-shadow:
                0 0 12px
                #ffd48a;
        }

        .legend-star {
            background: #e7ecff;

            box-shadow:
                0 0 8px
                #e7ecff;
        }

        .legend-region {
            background: #65a9ff;

            box-shadow:
                0 0 10px
                #65a9ff;
        }

        .legend-solar {
            background: #ffd85a;

            box-shadow:
                0 0 12px
                #ffd85a;
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        .galaxy-controls {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 9px;

            padding:
                18px 10px
                25px;
        }

        .galaxy-control {
            border:
                1px solid
                rgba(255,255,255,0.14);

            background:
                rgba(18,24,52,0.82);

            color: white;

            padding:
                10px 15px;

            border-radius: 9px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        .galaxy-control:hover {
            transform:
                translateY(-2px);

            background:
                rgba(65,76,145,0.82);
        }


        /* =====================================================
           FACTS
           ===================================================== */

        .galaxy-facts {
            width:
                min(
                    1100px,
                    92%
                );

            margin:
                0 auto 35px;

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0,1fr)
                );

            gap: 14px;
        }

        .fact-card {
            padding: 20px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.08);
        }

        .fact-card h3 {
            margin:
                0 0 8px;

            font-size: 0.92rem;
        }

        .fact-card p {
            margin: 0;

            font-size: 0.78rem;

            line-height: 1.6;

            opacity: 0.68;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .galaxy-footer {
            margin-top: auto;

            text-align: center;

            padding: 25px;

            border-top:
                1px solid
                rgba(255,255,255,0.08);

            font-size: 0.75rem;

            opacity: 0.5;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 800px) {

            .galaxy-container {
                height: 650px;
                min-height: 540px;
            }

            .galaxy-legend {
                display: none;
            }

            .galaxy-info {
                left: 14px;
                right: 14px;
                bottom: 14px;
                width: auto;
            }

            .galaxy-facts {
                grid-template-columns: 1fr;
            }

        }


/* ============================================================
   ASTROSPHERE MILKY WAY VISUAL EXPERIENCE V2
   Full frontend visual redesign
   Backend/scientific logic intentionally unchanged
   ============================================================ */

.galaxy-page {
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(27, 54, 105, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 12% 55%,
            rgba(46, 91, 180, 0.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 88% 45%,
            rgba(71, 45, 155, 0.10),
            transparent 28%
        ),
        #020611;

    color: #f5f7ff;
}

/* ------------------------------------------------------------
   HEADER
   ------------------------------------------------------------ */

.galaxy-v2-header {
    min-height: 74px;

    padding:
        0
        clamp(28px, 4vw, 72px);

    display: grid;
    grid-template-columns:
        minmax(220px, 1fr)
        auto
        minmax(220px, 1fr);

    align-items: center;
    gap: 28px;

    background:
        linear-gradient(
            180deg,
            rgba(3, 10, 25, 0.98),
            rgba(2, 7, 18, 0.94)
        );

    border-bottom:
        1px solid
        rgba(94, 128, 194, 0.20);

    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.28);

    backdrop-filter: blur(18px);

    position: relative;
    z-index: 50;
}

.galaxy-v2-header .galaxy-brand {
    display: flex;
    align-items: center;
    gap: 13px;
}

.galaxy-v2-header .galaxy-logo {
    width: 44px;
    height: 44px;

    display: grid;
    place-items: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8ee8ff,
            #2688ff 38%,
            #071a52 72%,
            #020611 100%
        );

    border:
        1px solid
        rgba(93, 180, 255, 0.60);

    box-shadow:
        0 0 22px rgba(34, 137, 255, 0.28);

    font-size: 22px;
}

.galaxy-v2-header .galaxy-brand h1 {
    margin: 0;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
}

.galaxy-v2-header .galaxy-brand p {
    margin: 2px 0 0;

    color: #8e9ab5;

    font-size: 11px;
}

/* ------------------------------------------------------------
   NAVIGATION
   ------------------------------------------------------------ */

.galaxy-v2-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.galaxy-v2-nav a {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 10px 15px;

    color: #c9d3e9;

    border:
        1px solid
        transparent;

    border-radius: 11px;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 12px;
    font-weight: 700;

    text-decoration: none;

    transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease,
        box-shadow .2s ease;
}

.galaxy-v2-nav a:hover {
    color: white;

    background:
        rgba(42, 83, 150, 0.18);

    border-color:
        rgba(88, 139, 220, 0.24);
}

.galaxy-v2-nav a.active {
    color: #f4f8ff;

    background:
        linear-gradient(
            180deg,
            rgba(20, 73, 143, 0.42),
            rgba(10, 40, 88, 0.46)
        );

    border-color:
        rgba(46, 137, 255, 0.55);

    box-shadow:
        0 0 22px rgba(34, 115, 235, 0.12);
}

/* ------------------------------------------------------------
   SEARCH
   ------------------------------------------------------------ */

.galaxy-search {
    justify-self: end;

    width: min(255px, 100%);

    height: 38px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 0 11px;

    border:
        1px solid
        rgba(105, 135, 190, 0.25);

    border-radius: 13px;

    background:
        rgba(9, 19, 42, 0.78);

    color: #71809e;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.035);
}

.galaxy-search input {
    min-width: 0;
    flex: 1;

    border: 0;
    outline: 0;

    background: transparent;

    color: #edf3ff;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 11px;
}

.galaxy-search input::placeholder {
    color: #65718b;
}

/* ------------------------------------------------------------
   REMOVE OLD HERO SPACE
   ------------------------------------------------------------ */

.galaxy-v2-hidden-hero {
    display: none !important;
}

/* ------------------------------------------------------------
   GALAXY VIEWER
   ------------------------------------------------------------ */

.galaxy-wrapper {
    width: min(1580px, calc(100% - 56px));
    margin: 24px auto 0;
}

.galaxy-container {
    position: relative;

    height: clamp(560px, 69vh, 720px);

    overflow: hidden;

    border-radius: 24px;

    background:
        radial-gradient(
            ellipse at 50% 52%,
            rgba(44, 72, 142, 0.16),
            transparent 48%
        ),
        radial-gradient(
            ellipse at 17% 42%,
            rgba(35, 88, 180, 0.13),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 83% 46%,
            rgba(79, 48, 170, 0.12),
            transparent 30%
        ),
        #01040c;

    border:
        1px solid
        rgba(102, 135, 198, 0.24);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.50),
        inset 0 1px 0 rgba(255,255,255,0.035);
}

.galaxy-container::before {
    content: "";

    position: absolute;
    inset: -20%;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 18% 45%,
            rgba(35, 100, 255, 0.14),
            transparent 22%
        ),
        radial-gradient(
            ellipse at 82% 43%,
            rgba(111, 65, 255, 0.13),
            transparent 22%
        ),
        radial-gradient(
            ellipse at 52% 54%,
            rgba(255, 187, 91, 0.08),
            transparent 27%
        );

    filter: blur(35px);

    z-index: 0;
}

.galaxy-container canvas {
    position: relative;
    z-index: 1;
}

/* ------------------------------------------------------------
   VIEWER CHROME
   ------------------------------------------------------------ */

.viewer-top {
    position: absolute;

    top: 20px;
    left: 20px;
    right: 20px;

    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: space-between;

    pointer-events: none;
}

.viewer-top > * {
    pointer-events: auto;
}

.galaxy-v2-map-chip,
.viewer-chip {
    padding: 9px 13px;

    border:
        1px solid
        rgba(133, 158, 210, 0.24);

    border-radius: 10px;

    background:
        rgba(2, 7, 17, 0.78);

    color: #e8edf8;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 10px;
    font-weight: 750;

    letter-spacing: 0.04em;

    backdrop-filter: blur(14px);

    box-shadow:
        0 8px 22px rgba(0,0,0,0.22);
}

/* ------------------------------------------------------------
   ZOOM CONTROL
   ------------------------------------------------------------ */

.galaxy-v2-zoom {
    position: absolute;

    right: 0;
    top: 0;

    display: flex;
    align-items: center;

    overflow: hidden;

    border:
        1px solid
        rgba(119, 149, 204, 0.28);

    border-radius: 12px;

    background:
        rgba(4, 10, 24, 0.88);

    backdrop-filter: blur(16px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.28);
}

.galaxy-v2-zoom button {
    width: 40px;
    height: 38px;

    border: 0;

    background:
        rgba(32, 61, 112, 0.72);

    color: white;

    font-size: 20px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .2s ease;
}

.galaxy-v2-zoom button:hover {
    background:
        rgba(43, 101, 187, 0.92);
}

.galaxy-v2-zoom span {
    min-width: 82px;

    text-align: center;

    color: #e6ecfa;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 11px;
    font-weight: 700;
}

/* ------------------------------------------------------------
   INFORMATION PANELS
   ------------------------------------------------------------ */

.galaxy-info,
.galaxy-legend {
    background:
        linear-gradient(
            145deg,
            rgba(6, 14, 31, 0.86),
            rgba(2, 7, 18, 0.92)
        ) !important;

    border:
        1px solid
        rgba(105, 137, 198, 0.25) !important;

    border-radius: 16px !important;

    box-shadow:
        0 18px 42px rgba(0,0,0,0.32),
        inset 0 1px 0 rgba(255,255,255,0.035) !important;

    backdrop-filter: blur(18px) !important;
}

.galaxy-info {
    left: 22px !important;
    bottom: 22px !important;

    width: 370px !important;

    padding: 20px !important;
}

.galaxy-info h3,
.galaxy-legend h4 {
    color: #f6f8ff !important;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif !important;
}

.galaxy-info p,
.galaxy-info .info-distance,
.galaxy-legend .legend-item {
    color: #b7c2d9 !important;
}

/* ------------------------------------------------------------
   FACT CARDS
   ------------------------------------------------------------ */

.galaxy-facts {
    width: min(1380px, calc(100% - 56px));

    margin: 18px auto 0;

    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 18px;
}

.fact-card {
    min-height: 105px;

    padding: 20px;

    border:
        1px solid
        rgba(92, 122, 181, 0.20);

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            rgba(10, 20, 42, 0.84),
            rgba(4, 9, 22, 0.94)
        );

    box-shadow:
        0 15px 38px rgba(0,0,0,0.28),
        inset 0 1px 0 rgba(255,255,255,0.035);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.fact-card:hover {
    transform: translateY(-2px);

    border-color:
        rgba(61, 137, 255, 0.38);

    box-shadow:
        0 20px 45px rgba(0,0,0,0.32),
        0 0 28px rgba(34, 108, 230, 0.07);
}

.fact-card h3 {
    margin-bottom: 9px;

    color: #f3f6ff;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 14px;
    font-weight: 800;
}

.fact-card p {
    color: #aebbd2;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    font-size: 12px;
    line-height: 1.6;
}

/* ------------------------------------------------------------
   CONTROL BAR
   ------------------------------------------------------------ */

.galaxy-controls {
    width: min(1180px, calc(100% - 56px));

    margin: 18px auto 0;

    padding: 10px;

    display: grid;

    grid-template-columns:
        1fr
        1fr
        1.35fr
        1.35fr;

    gap: 0;

    border:
        1px solid
        rgba(92, 125, 188, 0.22);

    border-radius: 18px;

    background:
        linear-gradient(
            180deg,
            rgba(10, 20, 43, 0.92),
            rgba(4, 9, 22, 0.96)
        );

    box-shadow:
        0 18px 50px rgba(0,0,0,0.38),
        inset 0 1px 0 rgba(255,255,255,0.035);

    backdrop-filter: blur(18px);
}

.galaxy-control {
    min-height: 64px;

    border: 0 !important;
    border-radius: 12px !important;

    background: transparent !important;

    color: #eef3ff !important;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif !important;

    font-size: 13px !important;
    font-weight: 750 !important;

    transition:
        background .2s ease,
        transform .2s ease,
        box-shadow .2s ease;
}

.galaxy-control + .galaxy-control {
    border-left:
        1px solid
        rgba(115, 143, 191, 0.16) !important;
}

.galaxy-control:hover {
    transform: translateY(-1px);

    background:
        rgba(37, 75, 139, 0.25) !important;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.04);
}

/* Solar System action */

.galaxy-control[href*="solar-system"],
.galaxy-control[href*="overview"] {
    color: #ffe16a !important;

    background:
        linear-gradient(
            135deg,
            rgba(116, 87, 5, 0.72),
            rgba(48, 35, 4, 0.88)
        ) !important;

    border:
        1px solid
        rgba(255, 210, 54, 0.38) !important;

    box-shadow:
        0 0 25px rgba(255, 196, 0, 0.07);
}

/* ------------------------------------------------------------
   FOOTER
   ------------------------------------------------------------ */

.galaxy-footer {
    margin-top: 28px !important;

    padding-bottom: 24px;

    color: #4f5d78 !important;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}

/* ------------------------------------------------------------
   RESPONSIVE
   ------------------------------------------------------------ */

@media (max-width: 1100px) {

    .galaxy-v2-header {
        grid-template-columns: 1fr auto;
    }

    .galaxy-v2-nav {
        order: 3;
        grid-column: 1 / -1;

        padding-bottom: 12px;
    }

    .galaxy-search {
        grid-column: 2;
    }

    .galaxy-facts {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 800px) {

    .galaxy-v2-header {
        grid-template-columns: 1fr;
        padding: 14px 20px;
    }

    .galaxy-search {
        grid-column: 1;
        justify-self: stretch;
        width: auto;
    }

    .galaxy-v2-nav {
        grid-column: 1;

        overflow-x: auto;

/* ============================================================
   NORMAL DISTRIBUTION
   ============================================================ */

function randomNormal() {

    let u = 0;
    let v = 0;

    while (u === 0) {
        u = Math.random();
    }

    while (v === 0) {
        v = Math.random();
    }

    return Math.sqrt(
        -2 *
        Math.log(u)
    ) *
    Math.cos(
        2 *
        Math.PI *
        v
    );

}


/* ============================================================
   RESIZE
   ============================================================ */

function resizeCanvas() {

    const rectangle =
        container.getBoundingClientRect();

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    width =
        rectangle.width;

    height =
        rectangle.height;

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    context.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    centerX =
        width / 2;

    centerY =
        height / 2;

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* ============================================================
   GENERATE STARS
   ============================================================ */

function generateStars() {

    stars = [];

    const count =
        6500;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const arm =
            Math.floor(
                Math.random() *
                galaxy.armCount
            );

        const radius =
            Math.pow(
                Math.random(),
                0.58
            );

        const baseAngle =
            (
                arm *
                (
                    Math.PI * 2 /
                    galaxy.armCount
                )
            );

        const spiral =
            baseAngle +
            radius *
            galaxy.armCurve;

        const armSpread =
            randomNormal() *
            (
                galaxy.thickness *
                (
                    0.35 +
                    radius
                )
            );

        const angle =
            spiral +
            armSpread;

        const x =
            Math.cos(angle) *
            radius;

        const y =
            Math.sin(angle) *
            radius;

        const random =
            Math.random();

        stars.push({

            x,

            y,

            size:
                random > 0.985
                    ? 2.4
                    : random > 0.92
                        ? 1.45
                        : random > 0.65
                            ? 0.9
                            : 0.5,

            brightness:
                0.25 +
                random * 0.75,

            warm:
                Math.random() < 0.13,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }


    /* Diffuse stellar disk population */

    for (
        let i = 0;
        i < 5000;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const radius =
            Math.pow(
                Math.random(),
                0.72
            ) *
            0.96;

        const x =
            Math.cos(angle) *
            radius;

        const y =
            Math.sin(angle) *
            radius;

        const random =
            Math.random();

        stars.push({

            x,

            y,

            size:
                random > 0.992
                    ? 1.8
                    : random > 0.94
                        ? 1.15
                        : random > 0.72
                            ? 0.7
                            : 0.42,

            brightness:
                0.12 +
                random *
                0.48,

            warm:
                Math.random() < 0.08,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }

    /* Dense central population */

    for (
        let i = 0;
        i < 2200;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const radius =
            Math.pow(
                Math.random(),
                2.5
            ) *
            0.34;

        stars.push({

            x:
                Math.cos(angle) *
                radius,

            y:
                Math.sin(angle) *
                radius,

            size:
                0.45 +
                Math.random() *
                1.4,

            brightness:
                0.35 +
                Math.random() *
                0.65,

            warm:
                Math.random() < 0.35,

            phase:
                Math.random() *
                Math.PI *
                2

        });

    }

}


/* ============================================================
   GENERATE DUST LANES
   ============================================================ */

function generateDust() {

    dust = [];

    const count =
        1100;

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const arm =
            Math.floor(
                Math.random() *
                galaxy.armCount
            );

        const radius =
            0.12 +
            Math.random() *
            0.82;

        const baseAngle =
            (
                arm *
                (
                    Math.PI * 2 /
                    galaxy.armCount
                )
            );

        const angle =
            baseAngle +
            radius *
            galaxy.armCurve +
            randomNormal() *
            0.045;

        dust.push({

            x:
                Math.cos(angle) *
                radius,

            y:
                Math.sin(angle) *
                radius,

            width:
                0.008 +
                Math.random() *
                0.018,

            alpha:
                0.025 +
                Math.random() *
                0.045

        });

    }

}

function generateNebulae() {

/* ============================================================
   GALACTIC BACKGROUND
   ============================================================ */

function drawBackground() {

    context.fillStyle =
        "#010208";

    context.fillRect(
        0,
        0,
        width,
        height
    );


    const glow =
        context.createRadialGradient(
            centerX,
            centerY,
            0,
            centerX,
            centerY,
            Math.min(
                width,
                height
            ) * 0.62
        );

    glow.addColorStop(
        0,
        "rgba(70,85,150,0.10)"
    );

    glow.addColorStop(
        0.45,
        "rgba(30,45,100,0.035)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    context.fillStyle =
        glow;

    context.fillRect(
        0,
        0,
        width,
        height
    );

}


/* ============================================================
   DRAW GALACTIC DISK
   ============================================================ */

function drawDisk() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    context.save();

    context.translate(
        centerX + offsetX,
        centerY + offsetY
    );

    context.rotate(
        rotation * 0.35
    );

    const disk =
        context.createRadialGradient(
            0,
            0,
            0,
            0,
            0,
            radius
        );

    disk.addColorStop(
        0,
        "rgba(255,210,145,0.12)"
    );

    disk.addColorStop(
        0.18,
        "rgba(130,155,225,0.065)"
    );

    disk.addColorStop(
        0.5,
        "rgba(80,105,180,0.035)"
    );

    disk.addColorStop(
        0.82,
        "rgba(30,45,100,0.015)"
    );

    disk.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    context.fillStyle =
        disk;

    context.beginPath();

    context.ellipse(
        0,
        0,
        radius,
        radius * 0.56,
        0,
        0,
        Math.PI * 2
    );

    context.fill();

    context.restore();

}


/* ============================================================
   DRAW CENTRAL BAR
   ============================================================ */

function drawBar() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    context.save();

    context.translate(
        centerX + offsetX,
        centerY + offsetY
    );

    context.rotate(
        rotation * 0.35
    );

    /*
     * Broad warm glow surrounding the stellar bar.
     */

    const glow =
        context.createLinearGradient(
            -radius * 0.38,
            0,
            radius * 0.38,
            0
        );

    glow.addColorStop(
        0,
        "rgba(255,185,105,0)"
    );

    glow.addColorStop(
        0.18,
        "rgba(255,185,105,0.035)"
    );

    glow.addColorStop(
        0.35,
        "rgba(255,205,135,0.085)"
    );

    glow.addColorStop(
        0.5,
        "rgba(255,225,175,0.13)"
    );

    glow.addColorStop(
        0.65,
        "rgba(255,205,135,0.085)"
    );

    glow.addColorStop(
        0.82,
        "rgba(255,185,105,0.035)"
    );

    glow.addColorStop(
        1,
        "rgba(255,185,105,0)"
    );

    context.fillStyle =
        glow;

    context.beginPath();

    context.ellipse(
        0,
        0,
        radius * 0.40,
        radius * 0.115,
        0,
        0,
        Math.PI * 2
    );

    context.fill();

    /*
     * Main stellar bar.
     */

    const bar =
        context.createLinearGradient(
            -radius * 0.30,
            0,
            radius * 0.30,
            0
        );

    bar.addColorStop(
        0,
        "rgba(255,180,95,0)"
    );

    bar.addColorStop(
        0.12,
        "rgba(255,185,105,0.08)"
    );

    bar.addColorStop(
        0.25,
        "rgba(255,200,125,0.16)"
    );

    bar.addColorStop(
        0.42,
        "rgba(255,220,165,0.25)"
    );

    bar.addColorStop(
        0.5,
        "rgba(255,235,195,0.31)"
    );

    bar.addColorStop(
        0.58,
        "rgba(255,220,165,0.25)"
    );

    bar.addColorStop(
        0.75,
        "rgba(255,200,125,0.16)"
    );

    bar.addColorStop(
        0.88,
        "rgba(255,185,105,0.08)"
    );

    bar.addColorStop(
        1,
        "rgba(255,180,95,0)"
    );

    context.fillStyle =
        bar;

    context.beginPath();

    context.ellipse(
        0,
        0,
        radius * 0.32,
        radius * 0.060,
        0,
        0,
        Math.PI * 2
    );

    context.fill();

    /*
     * Compact luminous bulge where the bar meets the core.
     */

    const core =
        context.createRadialGradient(
            0,
            0,
            0,
            0,
            0,
            radius * 0.14
        );

    core.addColorStop(
        0,
        "rgba(255,240,205,0.34)"
    );

    core.addColorStop(
        0.25,
        "rgba(255,220,165,0.22)"
    );

    core.addColorStop(
        0.6,
        "rgba(255,190,110,0.075)"
    );

    core.addColorStop(
        1,
        "rgba(255,170,90,0)"
    );

    context.fillStyle =
        core;

    context.beginPath();

    context.ellipse(
        0,
        0,
        radius * 0.16,
        radius * 0.095,
        0,
        0,
        Math.PI * 2
    );

    context.fill();

    context.restore();

}


/* ============================================================
   DRAW STARS

   ============================================================ */

function drawStars(time) {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const cos =
        Math.cos(
            rotation
        );

    const sin =
        Math.sin(
            rotation
        );

    for (
        let i = 0;
        i < stars.length;
        i++
    ) {

        const star =
            stars[i];

        const x =
            star.x * cos -
            star.y * sin;

        const y =
            star.x * sin +
            star.y * cos;

        const screenX =
            centerX +
            offsetX +
            x *
            radius;

        const screenY =
            centerY +
            offsetY +
            y *
            radius *
            0.56;

        if (
            screenX < -5 ||
            screenX > width + 5 ||
            screenY < -5 ||
            screenY > height + 5
        ) {
            continue;
        }

        const twinkle =
            0.88 +
            Math.sin(
                time * 0.001 +
                star.phase
            ) *
            0.12;

        const alpha =
            star.brightness *
            twinkle;

        const fill =
            star.warm
                ? `rgba(255,220,170,${alpha})`
                : `rgba(220,232,255,${alpha})`;

        context.fillStyle =
            fill;

        context.beginPath();

        context.arc(
            screenX,
            screenY,
            star.size *
            zoom,
            0,
            Math.PI * 2
        );

        context.fill();

    }

}


/* ============================================================
   DRAW DUST
   ============================================================ */

function drawDust() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const cos =
        Math.cos(
            rotation
        );

    const sin =
        Math.sin(
            rotation
        );

    for (
        let i = 0;
        i < dust.length;
        i++
    ) {

        const cloud =
            dust[i];

        const x =
            cloud.x * cos -
            cloud.y * sin;

        const y =
            cloud.x * sin +
            cloud.y * cos;

        const screenX =
            centerX +
            offsetX +
            x *
            radius;

        const screenY =
            centerY +
            offsetY +
            y *
            radius *
            0.56;

        /*
         * Give each dust cloud a slightly different orientation
         * and scale so the lanes do not look mechanically uniform.
         */

        const variation =
            0.78 +
            (
                Math.sin(
                    i * 1.731
                ) *
                0.22
            );

        const cloudWidth =
            cloud.width *
            radius *
            3.8 *
            variation;

        const cloudHeight =
            cloud.width *
            radius *
            (
                0.42 +
                (
                    Math.sin(
                        i * 0.917
                    ) +
                    1
                ) *
                0.08
            );

        const dustRotation =
            rotation +
            Math.sin(
                i * 1.37
            ) *
            0.30;

        /*
         * Main dust body.
         */

        context.fillStyle =
            `rgba(1,3,10,${cloud.alpha * 0.72})`;

        context.beginPath();

        context.ellipse(
            screenX,
            screenY,
            cloudWidth,
            cloudHeight,
            dustRotation,
            0,
            Math.PI * 2
        );

        context.fill();

        /*
         * Secondary diffuse edge on selected clouds.
         * This creates softer, irregular dust complexes.
         */

        if (
            i % 3 === 0
        ) {

            context.fillStyle =
                `rgba(3,6,18,${cloud.alpha * 0.28})`;

            context.beginPath();

            context.ellipse(
                screenX +
                Math.sin(i * 2.13) *
                radius *
                0.006,

                screenY +
                Math.cos(i * 1.81) *
                radius *
                0.004,

                cloudWidth *
                1.65,

                cloudHeight *
                1.45,

                dustRotation +
                0.12,

                0,
                Math.PI * 2
            );

            context.fill();
        }

    }

}


/* ============================================================
   DRAW NEBULAE

   ============================================================ */

/* ============================================================
   DRAW NEBULAE
   ============================================================ */
/* ============================================================
   DRAW STAR-FORMING REGIONS
   Compact nebular concentrations along the spiral structure.
   Frontend visualization only.
   ============================================================ */

function drawStarFormingRegions() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const cos =
        Math.cos(
            rotation
        );

    const sin =
        Math.sin(
            rotation
        );

    const armCount =
        galaxy.armCount || 4;

    const armCurve =
        galaxy.armCurve || 5.7;

    context.save();

    for (
        let arm = 0;
        arm < armCount;
        arm++
    ) {

        const armOffset =
            (
                Math.PI * 2 /
                armCount
            ) *
            arm;

        for (
            let region = 0;
            region < 7;
            region++
        ) {

            const radial =
                0.24 +
                region *
                0.105;

            const angle =
                armOffset +
                radial *
                armCurve +
                Math.sin(
                    region * 2.7 +
                    arm * 1.9
                ) *
                0.055;

            const x =
                Math.cos(angle) *
                radial;

            const y =
                Math.sin(angle) *
                radial;

            const rotatedX =
                x * cos -
                y * sin;

            const rotatedY =
                x * sin +
                y * cos;

            const screenX =
                centerX +
                offsetX +
                rotatedX *
                radius;

            const screenY =
                centerY +
                offsetY +
                rotatedY *
                radius *
                0.56;

            const size =
                radius *
                (
                    0.010 +
                    (
                        region % 3
                    ) *
                    0.003
                );

            const gradient =
                context.createRadialGradient(
                    screenX,
                    screenY,
                    0,
                    screenX,
                    screenY,
                    size
                );

            gradient.addColorStop(
                0,
                "rgba(255,225,190,0.18)"
            );

            gradient.addColorStop(
                0.28,
                "rgba(120,175,255,0.11)"
            );

            gradient.addColorStop(
                0.68,
                "rgba(90,125,230,0.045)"
            );

            gradient.addColorStop(
                1,
                "rgba(40,65,150,0)"
            );

            context.fillStyle =
                gradient;

            context.beginPath();

            context.arc(
                screenX,
                screenY,
                size,
                0,
                Math.PI * 2
            );

            context.fill();
        }
    }

    context.restore();
}


/* ============================================================
   DRAW NEBULAE
   ============================================================ */
function drawNebulae() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const cos =
        Math.cos(
            rotation
        );

    const sin =
        Math.sin(
            rotation
        );

    for (
        let i = 0;
        i < nebulae.length;
        i++
    ) {

        const nebula =
            nebulae[i];

        const x =
            nebula.x * cos -
            nebula.y * sin;

        const y =
            nebula.x * sin +
            nebula.y * cos;

        const screenX =
            centerX +
            offsetX +
            x *
            radius;

        const screenY =
            centerY +
            offsetY +
            y *
            radius *
            0.56;

        const size =
            nebula.radius *
            radius *
            4;

        const glow =
            context.createRadialGradient(
                screenX,
                screenY,
                0,
                screenX,
                screenY,
                size
            );

        glow.addColorStop(
            0,
            `rgba(80,160,255,${nebula.alpha})`
        );

        glow.addColorStop(
            0.3,
            `rgba(80,120,255,${nebula.alpha * 0.35})`
        );

        glow.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        context.fillStyle =
            glow;

        context.beginPath();

        context.arc(
            screenX,
            screenY,
            size,
            0,
            Math.PI * 2
        );

        context.fill();

    }

}


/* ============================================================
   DRAW GALACTIC CORE
   ============================================================ */

function drawCore() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const coreRadius =
        radius *
        0.19;

    const glow =
        context.createRadialGradient(
            centerX + offsetX,
            centerY + offsetY,
            0,
            centerX + offsetX,
            centerY + offsetY,
            coreRadius
        );

    glow.addColorStop(
        0,
        "rgba(255,248,220,0.98)"
    );

    glow.addColorStop(
        0.04,
        "rgba(255,225,165,0.9)"
    );

    glow.addColorStop(
        0.14,
        "rgba(255,190,110,0.52)"
    );

    glow.addColorStop(
        0.35,
        "rgba(190,155,110,0.18)"
    );

    glow.addColorStop(
        0.75,
        "rgba(100,120,190,0.045)"
    );

    glow.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    context.fillStyle =
        glow;

    context.beginPath();

    context.arc(
        centerX + offsetX,
        centerY + offsetY,
        coreRadius,
        0,
        Math.PI * 2
    );

    context.fill();


    /* central point */

    context.fillStyle =
        "rgba(255,250,230,0.98)";

    context.beginPath();

    context.arc(
        centerX + offsetX,
        centerY + offsetY,
        Math.max(
            3,
            5 * zoom
        ),
        0,
        Math.PI * 2
    );

    context.fill();

}


/* ============================================================
   DRAW SOLAR SYSTEM
   ============================================================ */

function drawSolarSystem() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const angle =
        galaxy.solarAngle +
        rotation;

    const x =
        centerX +
        offsetX +
        Math.cos(angle) *
        galaxy.solarRadius *
        radius;

    const y =
        centerY +
        offsetY +
        Math.sin(angle) *
        galaxy.solarRadius *
        radius *
        0.56;


    /* Orion Spur highlight */

    context.save();

    context.strokeStyle =
        "rgba(95,155,255,0.24)";

    context.lineWidth =
        10 *
        zoom;

    context.lineCap =
        "round";

    context.beginPath();

    const startAngle =
        angle - 0.30;

    const endAngle =
        angle + 0.30;

    const localRadius =
        galaxy.solarRadius *
        radius;

    context.arc(
        centerX + offsetX,
        centerY + offsetY,
        localRadius,
        startAngle,
        endAngle
    );

    context.stroke();

    context.restore();


    /* Solar glow */

    const glow =
        context.createRadialGradient(
            x,
            y,
            0,
            x,
            y,
            34 * zoom
        );

    glow.addColorStop(
        0,
        "rgba(255,238,145,1)"
    );

    glow.addColorStop(
        0.15,
        "rgba(255,215,80,0.7)"
    );

    glow.addColorStop(
        0.45,
        "rgba(255,200,70,0.2)"
    );

    glow.addColorStop(
        1,
        "rgba(255,200,70,0)"
    );

    context.fillStyle =
        glow;

    context.beginPath();

    context.arc(
        x,
        y,
        34 * zoom,
        0,
        Math.PI * 2
    );

    context.fill();


    context.fillStyle =
        "#ffd85a";

    context.beginPath();

    context.arc(
        x,
        y,
        Math.max(
            3,
            5 * zoom
        ),
        0,
        Math.PI * 2
    );

    context.fill();


    /* You are here ring */

    context.strokeStyle =
        "rgba(255,220,100,0.8)";

    context.lineWidth =
        1.5;

    context.beginPath();

    context.arc(
        x,
        y,
        13 * zoom,
        0,
        Math.PI * 2
    );

    context.stroke();


    return {
        x,
        y
    };

}


/* ============================================================
   DRAW LABELS
   ============================================================ */

function drawLabels(solarPosition) {

    const solarX =
        solarPosition.x;

    const solarY =
        solarPosition.y;


    context.font =
        "600 12px Inter, Segoe UI, Arial, sans-serif";

    context.textBaseline =
        "middle";


    /* Galactic Center */

    drawLabel(
        centerX +
        offsetX +
        18,

        centerY +
        offsetY -
        20,

        "GALACTIC CENTER",

        "rgba(255,205,130,0.92)"
    );


    /* Solar System */

    drawLabel(
        solarX + 20,

        solarY - 18,

        "☀️ YOU ARE HERE · SOLAR SYSTEM",

        "rgba(255,220,105,0.95)"
    );


    /* Orion Spur */

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const angle =
        galaxy.solarAngle +
        rotation;

    const spurX =
        centerX +
        offsetX +
        Math.cos(angle) *
        galaxy.solarRadius *
        radius *
        0.92;

    const spurY =
        centerY +
        offsetY +
        Math.sin(angle) *
        galaxy.solarRadius *
        radius *
        0.52;

    drawLabel(
        spurX - 45,

        spurY + 25,

        "ORION SPUR",

        "rgba(100,175,255,0.9)"
    );

}


/* ============================================================
   LABEL HELPER
   ============================================================ */

function drawLabel(
    x,
    y,
    text,
    textColor
) {

    const paddingX = 9;

    const paddingY = 6;

    const metrics =
        context.measureText(
            text
        );

    const width =
        metrics.width +
        paddingX * 2;

    const height =
        24;

    context.fillStyle =
        "rgba(0,0,0,0.68)";

    context.strokeStyle =
        "rgba(255,255,255,0.12)";

    context.lineWidth =
        1;

    context.beginPath();

    context.roundRect(
        x,
        y - height / 2,
        width,
        height,
        7
    );

    context.fill();

    context.stroke();

    context.fillStyle =
        textColor;

    context.fillText(
        text,
        x + paddingX,
        y
    );

}


/* ============================================================
   SCALE INDICATOR
   ============================================================ */

function drawScale() {

    const radius =
        Math.min(
            width,
            height
        ) *
        0.54 *
        zoom;

    const scaleWidth =
        Math.min(
            150,
            radius * 0.42
        );

    const x =
        width -
        scaleWidth -
        30;

    const y =
        50;


    context.strokeStyle =
        "rgba(255,255,255,0.5)";

    context.lineWidth =
        1;

    context.beginPath();

    context.moveTo(
        x,
        y
    );

    context.lineTo(
        x + scaleWidth,
        y
    );

    context.moveTo(
        x,
        y - 5
    );

    context.lineTo(
        x,
        y + 5
    );

    context.moveTo(
        x + scaleWidth,
        y - 5
    );

    context.lineTo(
        x + scaleWidth,
        y + 5
    );

    context.stroke();


    context.fillStyle =
        "rgba(255,255,255,0.55)";

    context.font =
        "10px Inter, Segoe UI, Arial, sans-serif";

    context.fillText(
        "≈ 25,000 light-years",
        x,
        y + 17
    );

}


/* ============================================================
   MAIN DRAW LOOP
   ============================================================ */

function draw(time) {

    drawBackground();

    drawDisk();

    drawBar();

    drawDust();

    drawNebulae();

    drawStarFormingRegions();

    drawStars(time);

    drawCore();

    const solarPosition =
        drawSolarSystem();

    drawLabels(
        solarPosition
    );

    drawScale();


    if (
        rotationEnabled
    ) {

        rotation +=
            0.00018;

    }


    requestAnimationFrame(
        draw
    );

}


/* ============================================================
   DRAG / PAN
   ============================================================ */

container.addEventListener(
    "mousedown",
    function(event) {

        dragging =
            true;

        previousX =
            event.clientX;

        previousY =
            event.clientY;

        container.classList.add(
            "dragging"
        );

    }
);


window.addEventListener(
    "mouseup",
    function() {

        dragging =
            false;

        container.classList.remove(
            "dragging"
        );

    }
);


window.addEventListener(
    "mousemove",
    function(event) {

        if (!dragging) {
            return;
        }

        const deltaX =
            event.clientX -
            previousX;

        const deltaY =
            event.clientY -
            previousY;

        rotation +=
            deltaX * 0.0025;

        offsetX +=
            deltaX * 0.18;

        offsetY +=
            deltaY * 0.18;

        previousX =
            event.clientX;

        previousY =
            event.clientY;

    }
);


/* ============================================================
   ZOOM
   ============================================================ */

container.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if (
            event.deltaY < 0
        ) {

            zoom *=
                1.08;

        } else {

            zoom *=
                0.92;

        }

        zoom =
            Math.max(
                0.55,
                Math.min(
                    zoom,
                    2.5
                )
            );

        viewerStatus.textContent =
            `Zoom ${zoom.toFixed(1)}×`;

    },
    {
        passive: false
    }
);


/* ============================================================
   ROTATION
   ============================================================ */

/* ============================================================
   VISUAL V2 ZOOM CONTROLS
   ============================================================ */

const galaxyZoomIn =
    document.getElementById("galaxyZoomIn");

const galaxyZoomOut =
    document.getElementById("galaxyZoomOut");

const galaxyZoomValue =
    document.getElementById("galaxyZoomValue");

function updateGalaxyZoomDisplay() {

    if (galaxyZoomValue) {

        galaxyZoomValue.textContent =
            `Zoom ${zoom.toFixed(1)}×`;

    }

}

if (galaxyZoomIn) {

    galaxyZoomIn.addEventListener(
        "click",
        function() {

            zoom *= 1.12;

            zoom = Math.max(
                0.55,
                Math.min(
                    zoom,
                    2.5
                )
            );

            updateGalaxyZoomDisplay();

        }
    );

}

if (galaxyZoomOut) {

    galaxyZoomOut.addEventListener(
        "click",
        function() {

            zoom *= 0.89;

            zoom = Math.max(
                0.55,
                Math.min(
                    zoom,
                    2.5
                )
            );

            updateGalaxyZoomDisplay();

        }
    );

}

updateGalaxyZoomDisplay();


rotationButton.addEventListener(
    "click",
    function() {

        rotationEnabled =
            !rotationEnabled;

        if (
            rotationEnabled
        ) {

            rotationButton.textContent =
                "⏸ Pause Rotation";

            viewerStatus.textContent =
                "Exploring";

        } else {

            rotationButton.textContent =
                "▶ Resume Rotation";

            viewerStatus.textContent =
                "Rotation Paused";

        }

    }
);


/* ============================================================
   RESET
   ============================================================ */

resetButton.addEventListener(
    "click",
    function() {

        rotation =
            0;

        zoom =
            1;

        offsetX =
            0;

        offsetY =
            0;

        viewerStatus.textContent =
            "Exploring";

        infoTitle.textContent =
            "Our Galactic Home";

        infoText.textContent =
            "The Milky Way is a barred spiral " +
            "galaxy containing hundreds of billions " +
            "of stars. The bright central region is " +
            "surrounded by an enormous stellar disk.";

        infoDistance.textContent =
            "Solar System: approximately 26,000 " +
            "light-years from the Galactic Center.";

    }
);


/* ============================================================
   CLICK INTERACTION
   ============================================================ */

container.addEventListener(
    "click",
    function(event) {

        const rectangle =
            container.getBoundingClientRect();

        const mouseX =
            event.clientX -
            rectangle.left;

        const mouseY =
            event.clientY -
            rectangle.top;


        const radius =
            Math.min(
                width,
                height
            ) *
            0.44 *
            zoom;


        /* Solar System */

        const solarAngle =
            galaxy.solarAngle +
            rotation;

        const solarX =
            centerX +
            offsetX +
            Math.cos(
                solarAngle
            ) *
            galaxy.solarRadius *
            radius;

        const solarY =
            centerY +
            offsetY +
            Math.sin(
                solarAngle
            ) *
            galaxy.solarRadius *
            radius *
            0.56;


        const solarDistance =
            Math.sqrt(
                Math.pow(
                    mouseX -
                    solarX,
                    2
                ) +
                Math.pow(
                    mouseY -
                    solarY,
                    2
                )
            );


        if (
            solarDistance < 30
        ) {

            infoTitle.textContent =
                "☀️ Our Solar System";

            infoText.textContent =
                "You are here. Our Solar System " +
                "lies within the Orion Spur, a " +
                "smaller spiral structure between " +
                "larger arms of the Milky Way.";

            infoDistance.textContent =
                "Approximately 26,000 light-years " +
                "from the Galactic Center.";

            viewerStatus.textContent =
                "Solar System Selected";

            /*
               Give the visitor a moment to see
               the selection before entering the
               next scale of the Universe Explorer.
            */

            setTimeout(
                function() {

                    window.location.href =
                        "/solar-system";

                },
                700
            );

            return;

        }


        /* Galactic Center */

        const centerDistance =
            Math.sqrt(
                Math.pow(
                    mouseX -
                    (
                        centerX +
                        offsetX
                    ),
                    2
                ) +
                Math.pow(
                    mouseY -
                    (
                        centerY +
                        offsetY
                    ),
                    2
                )
            );


        if (
            centerDistance <
            45 * zoom
        ) {

            infoTitle.textContent =
                "✨ Galactic Center";

            infoText.textContent =
                "The Galactic Center is the dense " +
                "central region of the Milky Way. " +
                "At its heart lies Sagittarius A*, " +
                "a supermassive black hole.";

            infoDistance.textContent =
                "Our Solar System is roughly " +
                "26,000 light-years from this region.";

            viewerStatus.textContent =
                "Galactic Center Selected";

        }

    }
);


/* ============================================================
   TOUCH SUPPORT
   ============================================================ */

let touchX = 0;
let touchY = 0;

container.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        touchX =
            event.touches[0].clientX;

        touchY =
            event.touches[0].clientY;

    }
);


container.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches.length !== 1
        ) {
            return;
        }

        const currentX =
            event.touches[0].clientX;

        const currentY =
            event.touches[0].clientY;

        const deltaX =
            currentX -
            touchX;

        const deltaY =
            currentY -
            touchY;

        rotation +=
            deltaX * 0.002;

        offsetX +=
            deltaX * 0.12;

        offsetY +=
            deltaY * 0.12;

        touchX =
            currentX;

        touchY =
            currentY;

    }
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

resizeCanvas();

generateStars();

generateDust();

generateNebulae();

requestAnimationFrame(
    draw
);


</script>
