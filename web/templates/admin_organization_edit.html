<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Edit an AstroSphere organization."
    >

    <title>Edit Organization â€” AstroSphere</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/auth.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="auth-page">

{% include "_navigation.html" %}

<main class="auth-main">

    <section class="page-shell">

        <div class="page-header page-header-with-action">

            <div>
                <p class="eyebrow">Administration</p>

                <h1>Edit Organization</h1>

                <p class="page-subtitle">
                    Update the organization's name, slug, and type.
                </p>
            </div>

            <div class="page-header-actions">
</div>

        </div>

        <div class="form-card">

            {% if error %}

            <div class="alert alert-error">
                {{ error }}
            </div>

            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="name">
                        Organization Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ organization.name }}"
                        required
                        autocomplete="organization"
                    >

                </div>


                <div class="form-group">

                    <label for="slug">
                        Organization Slug
                    </label>

                    <input
                        type="text"
                        id="slug"
                        name="slug"
                        value="{{ organization.slug }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="organization_type">
                        Organization Type
                    </label>

                    <select
                        id="organization_type"
                        name="organization_type"
                        required
                    >

                        {% for organization_type in organization_types %}

                        <option
                            value="{{ organization_type }}"
                            {% if organization.organization_type == organization_type %}
                            selected
                            {% endif %}
                        >
                            {{ organization_type.replace('_', ' ').title() }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-actions">
<a
                        class="button button-secondary"
                        href="{{ url_for('admin_organizations') }}"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="button button-primary"
                    >
                        ▣ Save Changes
                    </button>

                </div>

            </form>

        </div>

    </section>

</main>

</body>
</html>
