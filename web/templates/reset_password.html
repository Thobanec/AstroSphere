<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — AstroSphere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

    <main class="auth-main">
        <section class="auth-card">

            <div class="auth-brand">
                AstroSphere
            </div>

            <h1>Reset Password</h1>

            {% if error %}
                <div class="auth-alert">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="auth-alert">
                    {{ success }}
                </div>
            {% endif %}

            {% if token and not success %}
                <p class="auth-intro">
                    Choose a new password for your AstroSphere account.
                </p>

                <form
                    method="POST"
                    action="{{ url_for('reset_password_route', token=token) }}"
                    class="auth-form"
                >
                    <div class="auth-field">
                        <label for="password">
                            New password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label for="confirm_password">
                            Confirm new password
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >
                    </div>

                    <button type="submit" class="auth-submit">
                        Reset Password
                    </button>
                </form>
            {% endif %}

            <div class="auth-footer">
                <a href="{{ url_for('login') }}">
                    Return to login
                </a>
            </div>

        </section>
    </main>

</body>
</html>
